# Publishes the project site (site/, the privacy page made from
# docs/privacy.md, images from store/) with GitHub Pages:
# https://andrepaim.github.io/contextual-dictionary/
name: Site

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/privacy.md
      - store/*.png
      - src/icons/**
      - scripts/build-site.mjs
      - .github/workflows/pages.yml
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The build uses only Node's own modules: no install step.
      - run: node scripts/build-site.mjs _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
